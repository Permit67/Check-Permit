<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Your Offer Letter</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome আইকন -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- নেভবার সেকশন -->
    <nav class="navbar">
        <div class="nav-brand">
            <i class="fa-solid fa-globe"></i>
            <span>Verify Your Offer Letter</span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html"><i class="fa-solid fa-house"></i> Home</a></li>
            <li><a href="#"><i class="fa-solid fa-flag"></i> Countries</a></li>
            <li><a href="#"><i class="fa-solid fa-circle-info"></i> About</a></li>
        </ul>
    </nav>

    <!-- সাব-টেক্সট -->
    <div class="sub-banner">
        <h3><b>You can check your offer letter here. You are doing everything yourself.</b></h3>
    </div>

    <!-- মেইন কন্টেইনার -->
    <div class="main-container">
        <!-- ফ্লোটিং ওয়ার্ল্ড ম্যাপ ইমেজ -->
        <div class="map-container">
            <img alt="Floating Image" src="https://worldwide2.github.io/CHECKPERMIT/MP.png" class="world-map">
        </div>

        <h1><b>SELECT THE COUNTRY WHOSE OFFER LETTER YOU WANT TO VERIFY.</b></h1>

        <!-- পতাকার গ্রিড (শুধুমাত্র পর্তুগাল রাখা হয়েছে) -->
        <div class="flag-grid">
            <div class="flag-card" onclick="askPin('Portugal', 'UJJOL AHMED.pdf')">
                <img alt="Portugal Flag" src="https://worldwide2.github.io/CHECKPERMIT/8.png">
            </div>
        </div>
    </div>

    <script>
        function askPin(country, pdfFile) {
            let pass = prompt("Enter Secret Code (RR66) for " + country + ":");
            if (pass === "RR66") {
                if (pdfFile !== "") {
                    window.open(pdfFile, '_blank');
                } else {
                    alert("Correct Code! Access granted for " + country + ".");
                }
            } else if (pass !== null) {
                alert("Wrong Code! Access Denied.");
            }
        }
    </script>
</body>
</html>
