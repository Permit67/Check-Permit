    <script>
        function askPin(country, pdfFile) {
            let pass = prompt("Enter Secret Code (RR66) for " + country + ":");
            if (pass === "RR66") {
                if (pdfFile !== "") {
                    // সঠিক কোড দিলে শুধুমাত্র পর্তুগালের জন্য আপলোড করা পিডিএফ ওপেন হবে
                    window.open(pdfFile, '_blank');
                } else {
                    alert("Correct Code! Access granted for " + country + ".");
                }
            } else if (pass !== null) {
                alert("Wrong Code! Access Denied.");
            }
        }
    </script>
