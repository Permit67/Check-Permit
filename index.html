    <style>
        /* কাস্টম পাসওয়ার্ড মডাল স্টাইল */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .modal-box {
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            width: 300px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.3);
        }
        .modal-box h3 {
            margin-bottom: 15px;
            font-size: 16px;
            color: #333;
        }
        .modal-box input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 15px;
            box-sizing: border-box;
            text-align: center;
        }
        .modal-buttons button {
            padding: 8px 15px;
            margin: 0 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-submit { background: #0056b3; color: white; }
        .btn-cancel { background: #ccc; color: #333; }
    </style>

    <!-- পাসওয়ার্ড ইনপুট দেওয়ার গোপন বক্স (Modal) -->
    <div class="modal-overlay" id="passwordModal">
        <div class="modal-box">
            <h3>Enter Secret Code for Portugal</h3>
            <!-- type="password" দেওয়ার কারণে লেখাগুলো হাইড বা ডট হয়ে থাকবে -->
            <input type="password" id="pinInput" placeholder="Enter Code">
            <div class="modal-buttons">
                <button class="btn-submit" onclick="verifyPin()">Submit</button>
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        function openModal() {
            document.getElementById('passwordModal').style.display = 'flex';
            document.getElementById('pinInput').value = ''; // বক্স খালি করা
        }

        function closeModal() {
            document.getElementById('passwordModal').style.display = 'none';
        }

        function verifyPin() {
            let pass = document.getElementById('pinInput').value;
            if (pass === "RR66") {
                closeModal();
                window.open('UJJOL AHMED.pdf', '_blank');
            } else {
                alert("Wrong Code! Access Denied.");
            }
        }

        function otherCountry() {
            alert("No offer letter available for this country right now.");
        }
    </script>
